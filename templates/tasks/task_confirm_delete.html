<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer une tâche - TaskFlow</title>
</head>
<body>
    <h1>Supprimer une tâche</h1>

    <p>Veux-tu vraiment supprimer « {{ object.title }} » ?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmer la suppression</button>
    </form>

    <a href="{% url 'tasks:list' project_pk=object.project.pk %}">
        Annuler
    </a>
</body>
</html>
