<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer un projet - TaskFlow</title>
</head>
<body>
    <h1>Supprimer le projet</h1>

    <p>Veux-tu vraiment supprimer « {{ object.name }} » ?</p>

    <form method="post" >
        {% csrf_token %}
        <button type="submit">Confirmer la suppression</button>
    </form>

    <a href="{% url 'projets:list' %}">Annuler</a>
</body>
</html>
